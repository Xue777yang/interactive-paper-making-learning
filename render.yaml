services:
  - type: web
    name: paper-making-learning-api
    env: node
    rootDir: .
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@9.15.9 --activate && pnpm install --frozen-lockfile && pnpm db:generate && pnpm build:server
    startCommand: pnpm start:server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: PUBLIC_REGISTRATION_ENABLED
        value: "true"
      - key: ALLOW_TEACHER_REGISTRATION
        value: "false"
      - key: TEACHER_INVITE_CODE
        sync: false
      - key: VIDEO_BASE_URL
        value: /videos
      - key: AGENT_DAILY_LIMIT_PER_USER
        value: "50"
      - key: AGENT_RATE_LIMIT_PER_MINUTE
        value: "10"
